---
# CI for the Druxt module template, and the shape every Druxt module repository
# is expected to have. See the repository standard for what each job is for and
# why it exists.
#
# GitHub Actions (.github/workflows/ci.yml) runs the same lint and test set,
# because this repository is mirrored and releases are cut there. Keep the two
# in step: nothing on the GitHub side lints that workflow, so lint:yaml here
# runs actionlint over it in return.
#
# Secret scanning is gitleaks, not GitLab's Security/Secret-Detection template.
# That template is an Ultimate-tier feature: on a non-Ultimate instance the
# include produces no job at all, so the configuration reads as coverage while
# scanning nothing.

stages:
  - lint
  - test
  - visual
  - preview

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags: [docker]
  timeout: 15m
  before_script:
    - 'section_start() { local n="$1" t="${2:-$1}"; printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)" "$n" "$t"; }'
    - 'section_end() { printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$1"; }'

# Shared Node setup. `corepack prepare --activate` reads the packageManager
# field rather than naming a manager here, so this block is identical in every
# repository whatever it installs with. The cache is keyed by the lockfile
# hash: a dependency bump misses once and hits thereafter.
.node:
  image: node:16.20.1
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
      prefix: node-16.20.1
    paths:
      - .npm/
  before_script:
    - !reference [default, before_script]
    - corepack enable
    - corepack prepare --activate
    - npm ci --cache .npm --prefer-offline

#
# --- Lint ---
#

lint:js:
  extends: .node
  stage: lint
  script:
    - section_start "eslint" "Linting sources, tests and scripts"
    - npm run lint:js
    - section_end "eslint"

lint:md:
  extends: .node
  stage: lint
  script:
    - section_start "markdownlint" "Linting Markdown"
    - npm run lint:md
    - section_end "markdownlint"

lint:cspell:
  extends: .node
  stage: lint
  script:
    - section_start "cspell" "Spell checking"
    - npm run lint:cspell
    - section_end "cspell"

# This repository is public, and its README and example are what people copy to
# start a module. A host only the author can reach must never reach a tracked
# file.
lint:private:
  extends: .node
  stage: lint
  script:
    - section_start "private-refs" "Checking for private host references"
    - npm run lint:private
    - section_end "private-refs"

lint:knip:
  extends: .node
  stage: lint
  script:
    - section_start "knip" "Checking for unused and undeclared dependencies"
    - npm run lint:knip
    - section_end "knip"

# Production only. A shipped runtime dependency is what actually reaches a
# consumer; a devDependency advisory is worth knowing about and not worth
# blocking a merge request on.
lint:audit:
  extends: .node
  stage: lint
  script:
    - section_start "audit" "Auditing shipped dependencies"
    - npm run lint:audit
    - section_end "audit"

# yamllint covers this file; actionlint covers the GitHub workflow, which
# nothing on the GitHub side lints before a push.
lint:yaml:
  stage: lint
  image: python:3.12-slim
  interruptible: true
  variables:
    ACTIONLINT_VERSION: '1.7.12'
    ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  script:
    - section_start "yamllint" "Linting YAML"
    - pip install --quiet yamllint
    - yamllint .gitlab-ci.yml .github/workflows/
    - section_end "yamllint"
    - section_start "actionlint" "Linting GitHub workflows"
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
    - echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
    - tar -xzf actionlint.tar.gz actionlint
    - ./actionlint -color
    - section_end "actionlint"

# The merge request's own commits, not the whole history. These repositories
# squash-merge, so a prose title becomes the commit subject and breaks the next
# push to the target branch.
lint:commit:
  extends: .node
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - section_start "commitlint" "Validating commit messages"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth 50
    - npm run lint:commit -- --from "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --to HEAD --verbose
    - section_end "commitlint"

#
# --- Test ---
#

test:unit:
  extends: .node
  stage: test
  needs: []
  script:
    - section_start "build" "Building the module"
    - npm run build
    - section_end "build"
    - section_start "jest" "Running unit tests"
    - npm test -- --reporters=default --reporters=jest-junit --runInBand
    - section_end "jest"
  artifacts:
    when: always
    reports:
      junit: reports/junit/junit.xml
    paths:
      - coverage/
    expire_in: 1 week
  # Puts the coverage percentage in the merge request widget, where a drop is
  # visible to a reviewer who was never going to open the job log.
  coverage: '/All files\s*\|\s*([\d.]+)/'

#
# --- Visual ---
#
# Playwright against the example application. Baselines are committed, and are
# regenerated only by the manual visual:update job below: Chromium renders
# differently on ARM, and a baseline generated there is a permanent false diff
# for everyone else.
#

.playwright:
  extends: .node
  image: mcr.microsoft.com/playwright:v1.49.1-jammy
  variables:
    VISUAL_RESULTS_DIR: test-results

visual:
  extends: .playwright
  stage: visual
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - section_start "visual" "Running visual regression tests"
    - npm run build
    - npm run test:e2e
    - section_end "visual"
  after_script:
    # Posts baseline, render and diff for each failure as one sticky note, and
    # removes that note when the failure clears.
    - bash .gitlab/scripts/post-visual-failure-comment.sh || true
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
    expire_in: 1 week

# Manual baseline regeneration. Run this rather than regenerating locally: the
# shared runner is the reference architecture, and a baseline committed from a
# developer's ARM machine fails for everyone else.
visual:update:
  extends: .playwright
  stage: visual
  needs: []
  rules:
    - when: manual
      allow_failure: true
  script:
    - section_start "visual-update" "Regenerating visual baselines"
    - npm run build
    - npm run test:e2e:update
    - section_end "visual-update"
  artifacts:
    when: always
    paths:
      - test/e2e/__snapshots__/
    expire_in: 1 day

#
# --- Preview ---
#
# Manual. Serves the built example application through a Cloudflare Quick
# Tunnel and posts the URL to the merge request. The tunnel dies with the job.
#

preview:live:
  extends: .node
  stage: preview
  needs: []
  timeout: 1h
  variables:
    PREVIEW_DIR: example/nuxt/dist
    PREVIEW_KEEP_ALIVE_MINUTES: '55'
    PREVIEW_LABEL: 'Example application'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
      allow_failure: true
  script:
    - section_start "preview-build" "Building the example application"
    - npm run build
    - npm --prefix example/nuxt install
    - npm --prefix example/nuxt run generate
    - section_end "preview-build"
    - section_start "preview-tunnel" "Opening a cloudflared tunnel"
    - bash .gitlab/scripts/run-live-preview-tunnel.sh
    - section_end "preview-tunnel"

#
# --- Secret detection ---
#

secret-detection:
  stage: lint
  image: alpine:3.21
  interruptible: true
  dependencies: []
  variables:
    GITLEAKS_VERSION: '8.30.1'
    GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  script:
    - section_start "gitleaks" "Scanning for committed secrets"
    - apk add --no-cache curl tar git > /dev/null
    - curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    - echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
    - tar -xzf gitleaks.tar.gz gitleaks
    - ./gitleaks detect --source . --no-banner --redact --verbose
    - section_end "gitleaks"
    # A scan that finds nothing looks identical to a scan that cannot find
    # anything. Plant three credentials outside the repository and assert all
    # three are reported, so a bad download, a config change or a widened
    # allowlist fails the job instead of passing it quietly.
    #
    # Each value is split across its own prefix so no fragment in this file
    # triggers the rule it is meant to exercise: the repository scan above runs
    # over this file too, and a canary that flags itself would need an ignore
    # entry, which is the thing being guarded against.
    #
    # Fixed values, not generated ones. Detection is keyword-driven rather than
    # entropy-driven, so a generated credential fires only sometimes and
    # presents as flake. A value verified once keeps firing.
    #
    # Invented, not copied from any vendor's documentation: gitleaks allowlists
    # documentation keys, and a canary built from one is inert in exactly the
    # way this check exists to catch.
    - section_start "canary" "Checking that the scanner still detects"
    - |
      canary="$(mktemp -d)"
      pat="gh""p_8fK2mQ7xR4tV9nB3jH6yW1sZ5cD8gL0aE4uY"
      stripe="sk""_live_51aBcD2eFgH3iJkL4mNoP5qR6sTuV7wXyZ8a"
      slack="xo""xb-263594753641-2529420432-J1n4h6a9pQrStUvWxYz1AbCd"
      printf 'a = "%s"\nb = "%s"\nc = "%s"\n' "$pat" "$stripe" "$slack" > "$canary/canary.txt"
      ./gitleaks detect --no-git --source "$canary" --no-banner --redact \
        --report-format json --report-path "$canary/report.json" || true
      found=$(grep -c '"RuleID"' "$canary/report.json" || true)
      rm -rf "$canary"
      if [ "$found" != "3" ]; then
        echo "The canary planted 3 credentials and gitleaks reported $found."
        echo "The scan above proves nothing while this is true."
        exit 1
      fi
      echo "Canary detected 3 of 3 planted credentials."
    - section_end "canary"
