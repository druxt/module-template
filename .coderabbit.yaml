# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit skips any review over 100 changed files. The filters below leave
# out what nobody writes by hand, so a review covers the module, the example,
# the tooling and the pipelines.
language: en-AU
reviews:
  path_filters:
    # Lock files.
    - '!**/package-lock.json'
    - '!**/composer.lock'
    # Playwright baselines.
    - '!test/e2e/__snapshots__/**'
  auto_review:
    enabled: true
    drafts: false
